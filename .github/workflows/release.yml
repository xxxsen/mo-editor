name: Release Windows portable

on:
  push:
    tags:
      - '**'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.event.deleted == false }}
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Set up Rust
        run: rustup default stable-x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build portable executable
        run: npm run desktop:build

      - name: Name release asset from tag
        id: asset
        shell: pwsh
        run: |
          $safeTag = $env:GITHUB_REF_NAME -replace '[^A-Za-z0-9._-]', '-'
          $assetPath = "dist/MentalOmegaEditor-$safeTag.exe"
          Copy-Item -LiteralPath 'dist/MentalOmegaEditor.exe' -Destination $assetPath
          "path=$assetPath" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.asset.outputs.path }}
          fail_on_unmatched_files: true
          generate_release_notes: true
